<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dream Ladders Loader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
font-family:'Plus Jakarta Sans',sans-serif;
overflow:hidden;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

/* BACKGROUND */

.bg-grid{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size:50px 50px;
mask-image:radial-gradient(circle at center, black 20%, transparent 90%);
z-index:-2;
}

.mesh-gradient{
position:fixed;
inset:0;
z-index:-3;
background:
radial-gradient(circle at top left, rgba(59,130,246,0.18), transparent 40%),
radial-gradient(circle at bottom right, rgba(16,185,129,0.10), transparent 40%);
}

/* LOADER */

#loader{
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.loader-container{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

/* SVG LOGO */

.dl-logo{
width:220px;
height:220px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

#dl-svg{
width:100%;
height:100%;
overflow:visible;

filter:
drop-shadow(0 0 25px rgba(59,130,246,0.35))
drop-shadow(0 0 80px rgba(59,130,246,0.15));

animation:floatLogo 5s ease-in-out infinite;
}

.logo-part{
opacity:0;
stroke-dasharray:1800;
stroke-dashoffset:1800;
transform-origin:center;
}

/* COLORS */

.part-1{
stroke:#93c5fd;
}

.part-2{
stroke:#3b82f6;
}

.part-3{
stroke:#60a5fa;
}

.part-4{
stroke:#bfdbfe;
}

/* TEXT */

.loader-text{
margin-top:40px;
font-size:12px;
letter-spacing:0.45em;
text-transform:uppercase;
color:#94a3b8;
font-family:'JetBrains Mono',monospace;
opacity:0;
}

/* FLOAT */

@keyframes floatLogo{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

}

/* MOBILE */

@media(max-width:768px){

.dl-logo{
width:160px;
height:160px;
}

.loader-text{
font-size:10px;
letter-spacing:0.35em;
}

}

</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="mesh-gradient"></div>

<!-- LOADER -->

<div id="loader">

<div class="loader-container">

<div class="dl-logo">

<svg
id="dl-svg"
viewBox="0 0 800 600"
xmlns="http://www.w3.org/2000/svg"
fill="none"
stroke-width="8"
stroke-linejoin="round"
stroke-linecap="round"
>

<!-- LEFT -->

<polygon
class="logo-part part-1"
points="
230.35,133.128
285.541,187.116
262.888,187.078
310.05,233.562
310.429,396.224
378.424,396.193
378.44,471.944
230.329,471.972"
/>

<!-- MAIN -->

<polygon
class="logo-part part-2"
points="
269.998,190.417
349.141,265.5
418.464,265.547
539.061,358.817
418.888,452.675
418.803,528.578
574.94,406.814
574.984,311.874
416.252,190.356"
/>

<!-- TOP -->

<polygon
class="logo-part part-3"
points="
242.282,134.03
298.086,187.135
418.187,187.145
547.029,286.032
547.095,255.447
388.476,133.935
"
/>

<!-- CENTER -->

<polygon
class="logo-part part-4"
points="
486.859,322.148
534.663,358.821
391.093,469.642
391.002,396.255
"
/>

</svg>

</div>

<div class="loader-text">
Dream Ladders
</div>

</div>

</div>

<script>

/* LOADER ANIMATION */

window.addEventListener("load", () => {

const tl = gsap.timeline();

/* INITIAL STATES */

gsap.set(".part-1",{
x:-120,
rotation:-25,
scale:0.8
});

gsap.set(".part-2",{
x:120,
rotation:25,
scale:0.8
});

gsap.set(".part-3",{
y:-80,
rotation:-10
});

gsap.set(".part-4",{
scale:0,
opacity:0
});

/* ANIMATION */

tl.to(".part-1",{
opacity:1,
strokeDashoffset:0,
x:0,
rotation:0,
scale:1,
duration:1.2,
ease:"power3.out"
})

.to(".part-2",{
opacity:1,
strokeDashoffset:0,
x:0,
rotation:0,
scale:1,
duration:1.2,
ease:"power3.out"
},"-=0.9")

.to(".part-3",{
opacity:1,
strokeDashoffset:0,
y:0,
rotation:0,
duration:1,
ease:"power3.out"
},"-=0.8")

.to(".part-4",{
opacity:1,
strokeDashoffset:0,
scale:1,
duration:0.8,
ease:"back.out(2)"
},"-=0.6")

.to("#dl-svg",{
scale:1.05,
duration:0.5,
ease:"power2.out"
})

.to(".loader-text",{
opacity:1,
y:-5,
duration:0.8
},"-=0.2")

.to("#loader",{
opacity:0,
duration:1,
delay:1,
onComplete:()=>{

document.getElementById("loader").style.display="none";

}
});

});

</script>

</body>
</html>
